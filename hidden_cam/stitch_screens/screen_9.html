<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_27 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_27" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_27');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Aegis 3D Companion Interactive Three.js Scene
// Container provided by environment: container

const width = container.clientWidth || window.innerWidth || 390;
const height = container.clientHeight || 280;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
camera.position.set(0, 0, 4.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting setup for warm, soft, premium aesthetic (Serene Safeguard theme)
const ambientLight = new THREE.AmbientLight(0xf4fbf6, 1.2);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
mainLight.position.set(2, 4, 3);
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0x759c84, 2.2);
rimLight.position.set(-3, -2, -1);
scene.add(rimLight);

const pointLight = new THREE.PointLight(0x52b788, 2.5, 8);
pointLight.position.set(0, 0.5, 1.8);
scene.add(pointLight);

// Character Group
const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

// Stylized 3D Avatar Construction (Aegis Guide)
// Head & Face
const headGeo = new THREE.SphereGeometry(0.72, 32, 32);
headGeo.scale(0.9, 1.05, 0.95);
const skinMat = new THREE.MeshStandardMaterial({
  color: 0x93654b,
  roughness: 0.65,
  metalness: 0.05
});
const head = new THREE.Mesh(headGeo, skinMat);
head.position.y = 0.35;
avatarGroup.add(head);

// Hair - modern neat textured cut
const hairGeo = new THREE.SphereGeometry(0.75, 24, 24);
hairGeo.scale(0.93, 0.95, 0.98);
const hairMat = new THREE.MeshStandardMaterial({
  color: 0x221815,
  roughness: 0.9,
  metalness: 0.0
});
const hair = new THREE.Mesh(hairGeo, hairMat);
hair.position.set(0, 0.52, -0.05);
avatarGroup.add(hair);

// Forehead curl / hair volume
const curlGeo = new THREE.DodecahedronGeometry(0.24, 1);
const curl1 = new THREE.Mesh(curlGeo, hairMat);
curl1.position.set(0.18, 1.05, 0.45);
avatarGroup.add(curl1);
const curl2 = new THREE.Mesh(curlGeo, hairMat);
curl2.position.set(-0.2, 1.03, 0.48);
curl2.scale.set(0.9, 0.9, 0.9);
avatarGroup.add(curl2);

// Eyes (Friendly, warm intelligent eyes)
const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const irisMat = new THREE.MeshBasicMaterial({ color: 0x47281c });
const pupilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function createEye(isRight) {
  const eyeG = new THREE.Group();
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), eyeWhiteMat);
  white.scale.set(1.2, 0.9, 0.5);
  eyeG.add(white);

  const iris = new THREE.Mesh(new THREE.CircleGeometry(0.08, 16), irisMat);
  iris.position.set(0, 0, 0.08);
  eyeG.add(iris);

  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.045, 16), pupilMat);
  pupil.position.set(0, 0, 0.082);
  eyeG.add(pupil);

  const highlight = new THREE.Mesh(new THREE.CircleGeometry(0.025, 12), highlightMat);
  highlight.position.set(0.02, 0.02, 0.084);
  eyeG.add(highlight);

  const xPos = isRight ? 0.23 : -0.23;
  eyeG.position.set(xPos, 0.42, 0.65);
  return eyeG;
}

const leftEye = createEye(false);
const rightEye = createEye(true);
avatarGroup.add(leftEye);
avatarGroup.add(rightEye);

// Eyebrows
const browMat = new THREE.MeshBasicMaterial({ color: 0x1f140e });
const browGeo = new THREE.BoxGeometry(0.2, 0.035, 0.05);
const leftBrow = new THREE.Mesh(browGeo, browMat);
leftBrow.position.set(-0.24, 0.58, 0.66);
leftBrow.rotation.z = 0.08;
avatarGroup.add(leftBrow);

const rightBrow = new THREE.Mesh(browGeo, browMat);
rightBrow.position.set(0.24, 0.58, 0.66);
rightBrow.rotation.z = -0.08;
avatarGroup.add(rightBrow);

// Cheerful natural smile
const smileCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(-0.16, 0.16, 0.66),
  new THREE.Vector3(-0.08, 0.11, 0.69),
  new THREE.Vector3(0.08, 0.11, 0.69),
  new THREE.Vector3(0.16, 0.16, 0.66)
);
const smileGeo = new THREE.TubeGeometry(smileCurve, 16, 0.02, 8, false);
const smileMat = new THREE.MeshStandardMaterial({ color: 0x6e382b, roughness: 0.5 });
const smile = new THREE.Mesh(smileGeo, smileMat);
avatarGroup.add(smile);

// Neck
const neckGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.4, 16);
const neck = new THREE.Mesh(neckGeo, skinMat);
neck.position.y = -0.22;
avatarGroup.add(neck);

// Torso / Pullover Vest (Sage Green & Cream)
const torsoGroup = new THREE.Group();
const vestGeo = new THREE.CylinderGeometry(0.58, 0.68, 1.1, 24);
const vestMat = new THREE.MeshStandardMaterial({
  color: 0x5a7e68, // Soft Sage Green
  roughness: 0.8,
  metalness: 0.05
});
const vest = new THREE.Mesh(vestGeo, vestMat);
vest.position.y = -0.85;
torsoGroup.add(vest);

// Cream inner collar / undershirt
const collarGeo = new THREE.TorusGeometry(0.32, 0.08, 12, 24);
const collarMat = new THREE.MeshStandardMaterial({ color: 0xf5f3ea, roughness: 0.8 });
const collar = new THREE.Mesh(collarGeo, collarMat);
collar.rotation.x = Math.PI / 2;
collar.position.y = -0.32;
torsoGroup.add(collar);

// Cream lower stripe on pullover
const stripeGeo = new THREE.CylinderGeometry(0.66, 0.69, 0.38, 24);
const stripe = new THREE.Mesh(stripeGeo, collarMat);
stripe.position.y = -1.15;
torsoGroup.add(stripe);

// Shoulders
const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x5a7e68, roughness: 0.8 });
const leftShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), shoulderMat);
leftShoulder.position.set(-0.68, -0.6, 0);
torsoGroup.add(leftShoulder);

const rightShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), shoulderMat);
rightShoulder.position.set(0.68, -0.6, 0);
torsoGroup.add(rightShoulder);

// Waving Right Arm (Greeting gesture)
const armGroup = new THREE.Group();
armGroup.position.set(0.72, -0.58, 0);

const upperArmGeo = new THREE.CylinderGeometry(0.18, 0.16, 0.55, 16);
const upperArm = new THREE.Mesh(upperArmGeo, shoulderMat);
upperArm.position.set(0.2, 0.22, 0.15);
upperArm.rotation.z = -0.6;
upperArm.rotation.x = 0.3;
armGroup.add(upperArm);

const forearmGroup = new THREE.Group();
forearmGroup.position.set(0.38, 0.45, 0.28);

const forearmGeo = new THREE.CylinderGeometry(0.15, 0.13, 0.5, 16);
const forearm = new THREE.Mesh(forearmGeo, collarMat);
forearm.position.y = 0.25;
forearm.rotation.z = 0.25;
forearmGroup.add(forearm);

// Hand waving
const handGeo = new THREE.SphereGeometry(0.17, 16, 16);
handGeo.scale(1.1, 1.3, 0.4);
const hand = new THREE.Mesh(handGeo, skinMat);
hand.position.set(0.08, 0.55, 0);
hand.rotation.z = -0.15;
forearmGroup.add(hand);

// Fingers
const fingerGeo = new THREE.CylinderGeometry(0.035, 0.03, 0.22, 8);
for (let i = 0; i < 4; i++) {
  const finger = new THREE.Mesh(fingerGeo, skinMat);
  finger.position.set(-0.06 + i * 0.045, 0.7, 0);
  finger.rotation.z = (i - 1.5) * 0.08;
  forearmGroup.add(finger);
}

armGroup.add(forearmGroup);
torsoGroup.add(armGroup);

// Left Resting Arm
const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.14, 0.85, 16), shoulderMat);
leftArm.position.set(-0.76, -0.92, 0.08);
leftArm.rotation.z = 0.12;
torsoGroup.add(leftArm);

avatarGroup.add(torsoGroup);

// FLOATING HOLOGRAPHIC SHIELD BADGE (Interactive & Glowing)
const shieldGroup = new THREE.Group();
const shieldShape = new THREE.Shape();
shieldShape.moveTo(0, 0.42);
shieldShape.quadraticCurveTo(0.32, 0.38, 0.35, 0.1);
shieldShape.quadraticCurveTo(0.32, -0.28, 0, -0.45);
shieldShape.quadraticCurveTo(-0.32, -0.28, -0.35, 0.1);
shieldShape.quadraticCurveTo(-0.32, 0.38, 0, 0.42);

const extrudeSettings = { depth: 0.06, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.03, bevelThickness: 0.03 };
const shieldGeo = new THREE.ExtrudeGeometry(shieldShape, extrudeSettings);
const shieldMat = new THREE.MeshStandardMaterial({
  color: 0x52b788,
  roughness: 0.25,
  metalness: 0.4,
  emissive: 0x2d6a4f,
  emissiveIntensity: 0.4,
  transparent: true,
  opacity: 0.92
});
const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
shieldMesh.scale.set(0.65, 0.65, 0.65);
shieldGroup.add(shieldMesh);

// Glowing Checkmark inside shield
const checkCurve = new THREE.CurvePath();
const line1 = new THREE.LineCurve3(new THREE.Vector3(-0.09, -0.01, 0.06), new THREE.Vector3(-0.02, -0.09, 0.06));
const line2 = new THREE.LineCurve3(new THREE.Vector3(-0.02, -0.09, 0.06), new THREE.Vector3(0.11, 0.07, 0.06));
checkCurve.add(line1);
checkCurve.add(line2);
const checkGeo = new THREE.TubeGeometry(checkCurve, 16, 0.022, 8, false);
const checkMat = new THREE.MeshBasicMaterial({ color: 0xebfeef });
const checkMesh = new THREE.Mesh(checkGeo, checkMat);
shieldGroup.add(checkMesh);

shieldGroup.position.set(-0.55, 0.05, 0.95);
avatarGroup.add(shieldGroup);

// HOLOGRAPHIC SENSOR PULSE RINGS (Live Scanning Orbit)
const ringGeo = new THREE.TorusGeometry(1.4, 0.012, 16, 64);
const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x52b788, transparent: true, opacity: 0.45 });
const ring1 = new THREE.Mesh(ringGeo, ringMat1);
ring1.rotation.x = Math.PI / 2.3;
ring1.position.y = -0.2;
scene.add(ring1);

const ringGeo2 = new THREE.TorusGeometry(1.65, 0.008, 16, 64);
const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x74c69d, transparent: true, opacity: 0.3 });
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.x = Math.PI / 2.1;
ring2.rotation.y = 0.25;
ring2.position.y = -0.25;
scene.add(ring2);

// Ambient Floating Sensor Nodes
const nodeGeo = new THREE.SphereGeometry(0.04, 12, 12);
const nodeMat = new THREE.MeshBasicMaterial({ color: 0x95d5b2 });
const nodes = [];
for (let i = 0; i < 4; i++) {
  const node = new THREE.Mesh(nodeGeo, nodeMat);
  scene.add(node);
  nodes.push({ mesh: node, angle: (i * Math.PI) / 2, speed: 0.015 + i * 0.005, radius: 1.4 + (i % 2) * 0.25 });
}

// Mouse / Touch Interaction Tracking
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

function onPointerMove(e) {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - rect.left;
  const y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - rect.top;
  targetX = (x / rect.width - 0.5) * 2;
  targetY = (y / rect.height - 0.5) * 2;
}

window.addEventListener('mousemove', onPointerMove);
window.addEventListener('touchmove', onPointerMove, { passive: true });

// Animation Loop
let clock = new THREE.Clock();
let blinkTimer = 0;
let isBlinking = false;

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Smooth mouse interpolation
  mouseX += (targetX - mouseX) * 0.06;
  mouseY += (targetY - mouseY) * 0.06;

  // Natural head tracking & breathing
  const breathing = Math.sin(time * 2.2) * 0.035;
  avatarGroup.position.y = -0.1 + breathing;
  
  // Head subtle turns towards cursor
  head.rotation.y = mouseX * 0.35 + Math.sin(time * 0.8) * 0.05;
  head.rotation.x = mouseY * 0.2 + Math.cos(time * 1.1) * 0.03;

  // Eye movement tracking
  leftEye.position.x = -0.23 + mouseX * 0.04;
  leftEye.position.y = 0.42 - mouseY * 0.04;
  rightEye.position.x = 0.23 + mouseX * 0.04;
  rightEye.position.y = 0.42 - mouseY * 0.04;

  // Blinking system
  blinkTimer += 0.016;
  if (blinkTimer > 3.5 && !isBlinking) {
    isBlinking = true;
  }
  if (isBlinking) {
    leftEye.scale.y = 0.1;
    rightEye.scale.y = 0.1;
    if (blinkTimer > 3.65) {
      leftEye.scale.y = 1.0;
      rightEye.scale.y = 1.0;
      isBlinking = false;
      blinkTimer = 0;
    }
  }

  // Natural waving hand animation
  const wave = Math.sin(time * 5.0) * 0.35;
  forearmGroup.rotation.z = 0.35 + wave;
  hand.rotation.z = -0.1 + wave * 0.4;

  // Floating shield gentle bounce & rotation
  shieldGroup.position.y = 0.05 + Math.sin(time * 3.0) * 0.08;
  shieldGroup.rotation.y = Math.sin(time * 2.0) * 0.25;

  // Sensor rings rotation
  ring1.rotation.z = time * 0.4;
  ring2.rotation.z = -time * 0.3;

  // Orbiting sensor telemetry nodes
  nodes.forEach(n => {
    n.angle += n.speed;
    n.mesh.position.x = Math.cos(n.angle) * n.radius;
    n.mesh.position.z = Math.sin(n.angle) * n.radius * 0.5;
    n.mesh.position.y = -0.2 + Math.sin(time * 3 + n.angle) * 0.18;
  });

  renderer.render(scene, camera);
}

animate();

// Resize handling
function onResize() {
  const newW = container.clientWidth || window.innerWidth || 390;
  const newH = container.clientHeight || 280;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
}
window.addEventListener('resize', onResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_27 -->
</body>
</html>
