<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch Screens Gallery</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        .card .title {
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .no-image {
            width: 100%;
            height: 200px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>SafeLens Screens</h1>

    <div class="grid">
        <a href="screen_1.html" class="card">
            <img src="screen_1.jpg" alt="Screen 1">
            <div class="title">Screen 1</div>
        </a>
        <a href="screen_2.html" class="card">
            <img src="screen_2.jpg" alt="Screen 2">
            <div class="title">Screen 2</div>
        </a>
        <a href="screen_5.html" class="card">
            <img src="screen_5.jpg" alt="Screen 5">
            <div class="title">Screen 5</div>
        </a>
        <a href="screen_6.html" class="card">
            <div class="no-image">No Image Available</div>
            <div class="title">Screen 6 (HTML Only)</div>
        </a>
        <a href="screen_8.html" class="card">
            <img src="screen_8.jpg" alt="Screen 8">
            <div class="title">Screen 8</div>
        </a>
        <a href="screen_9.html" class="card">
            <div class="no-image">No Image Available</div>
            <div class="title">Screen 9 (HTML Only)</div>
        </a>
        <a href="screen_10.html" class="card">
            <img src="screen_10.jpg" alt="Screen 10">
            <div class="title">Screen 10</div>
        </a>
    </div>

</body>
</html>
