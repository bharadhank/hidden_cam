<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_36 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_36" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_36');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D Animated Character Scene (Three.js)
// Featuring the exact young anime-style safety companion: high bun hair, soft bangs, dark teal zip hoodie with shield badge.
const width = container.clientWidth || window.innerWidth || 390;
const height = container.clientHeight || 280;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
camera.position.set(0, 0, 4.4);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xf4fbf6, 1.4);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.8);
keyLight.position.set(2.5, 4, 3.5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x759c84, 1.5);
fillLight.position.set(-3, 1, 2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x52b788, 2.0, 10);
rimLight.position.set(0, 2, -2);
scene.add(rimLight);

const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

// Materials
const skinMat = new THREE.MeshStandardMaterial({
  color: 0xffdfd0,
  roughness: 0.55,
  metalness: 0.02
});

const hairMat = new THREE.MeshStandardMaterial({
  color: 0x1a181b,
  roughness: 0.8,
  metalness: 0.05
});

const hoodieMat = new THREE.MeshStandardMaterial({
  color: 0x2d5a4c, // Deep teal-green
  roughness: 0.85,
  metalness: 0.02
});

const whiteTeeMat = new THREE.MeshStandardMaterial({
  color: 0xf8fafc,
  roughness: 0.8,
  metalness: 0.0
});

// Head (Soft anime proportions)
const headGeo = new THREE.SphereGeometry(0.7, 32, 32);
headGeo.scale(0.92, 1.05, 0.95);
const head = new THREE.Mesh(headGeo, skinMat);
head.position.y = 0.35;
avatarGroup.add(head);

// Cheek blush
const blushMat = new THREE.MeshBasicMaterial({ color: 0xffa4a4, transparent: true, opacity: 0.35 });
const leftBlush = new THREE.Mesh(new THREE.CircleGeometry(0.12, 16), blushMat);
leftBlush.position.set(-0.35, 0.28, 0.63);
leftBlush.rotation.y = -0.3;
avatarGroup.add(leftBlush);

const rightBlush = new THREE.Mesh(new THREE.CircleGeometry(0.12, 16), blushMat);
rightBlush.position.set(0.35, 0.28, 0.63);
rightBlush.rotation.y = 0.3;
avatarGroup.add(rightBlush);

// High Bun Hair
const baseHairGeo = new THREE.SphereGeometry(0.74, 24, 24);
baseHairGeo.scale(0.96, 1.02, 1.02);
const baseHair = new THREE.Mesh(baseHairGeo, hairMat);
baseHair.position.set(0, 0.48, -0.06);
avatarGroup.add(baseHair);

// Signature High Bun on Top
const topBunGroup = new THREE.Group();
const bunGeo = new THREE.SphereGeometry(0.42, 24, 24);
bunGeo.scale(1.05, 0.92, 0.98);
const topBun = new THREE.Mesh(bunGeo, hairMat);
topBunGroup.add(topBun);

// Hair scrunchie/tie
const tieGeo = new THREE.TorusGeometry(0.32, 0.06, 12, 24);
const tieMat = new THREE.MeshStandardMaterial({ color: 0x224237, roughness: 0.9 });
const scrunchie = new THREE.Mesh(tieGeo, tieMat);
scrunchie.rotation.x = Math.PI / 2;
scrunchie.position.y = -0.22;
topBunGroup.add(scrunchie);

topBunGroup.position.set(0, 1.25, -0.05);
avatarGroup.add(topBunGroup);

// Soft Bangs & Tendrils framing face
const bangGeo = new THREE.ConeGeometry(0.18, 0.45, 12);
const bangL = new THREE.Mesh(bangGeo, hairMat);
bangL.position.set(-0.25, 0.88, 0.62);
bangL.rotation.z = 0.35;
bangL.rotation.x = 0.2;
avatarGroup.add(bangL);

const bangR = new THREE.Mesh(bangGeo, hairMat);
bangR.position.set(0.18, 0.9, 0.64);
bangR.rotation.z = -0.25;
bangR.rotation.x = 0.2;
avatarGroup.add(bangR);

const tendrilL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.02, 0.6, 8), hairMat);
tendrilL.position.set(-0.62, 0.25, 0.45);
tendrilL.rotation.z = 0.15;
avatarGroup.add(tendrilL);

const tendrilR = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.02, 0.6, 8), hairMat);
tendrilR.position.set(0.62, 0.25, 0.45);
tendrilR.rotation.z = -0.15;
avatarGroup.add(tendrilR);

// Eyes (Large, expressive anime brown eyes)
const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const irisMat = new THREE.MeshBasicMaterial({ color: 0x3d2217 });
const pupilMat = new THREE.MeshBasicMaterial({ color: 0x110805 });
const gleamMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function createAnimeEye(isRight) {
  const g = new THREE.Group();
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), eyeWhiteMat);
  sclera.scale.set(1.3, 1.1, 0.4);
  g.add(sclera);

  const iris = new THREE.Mesh(new THREE.CircleGeometry(0.11, 16), irisMat);
  iris.position.set(0, 0, 0.075);
  g.add(iris);

  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.065, 16), pupilMat);
  pupil.position.set(0, 0, 0.078);
  g.add(pupil);

  // Big anime gleam highlights
  const gleam1 = new THREE.Mesh(new THREE.CircleGeometry(0.035, 12), gleamMat);
  gleam1.position.set(0.035, 0.035, 0.082);
  g.add(gleam1);
  const gleam2 = new THREE.Mesh(new THREE.CircleGeometry(0.018, 12), gleamMat);
  gleam2.position.set(-0.03, -0.03, 0.082);
  g.add(gleam2);

  const xPos = isRight ? 0.24 : -0.24;
  g.position.set(xPos, 0.44, 0.63);
  return g;
}

const leftEye = createAnimeEye(false);
const rightEye = createAnimeEye(true);
avatarGroup.add(leftEye);
avatarGroup.add(rightEye);

// Upper Eyelashes
const lashMat = new THREE.MeshBasicMaterial({ color: 0x1a181b });
const lashGeo = new THREE.BoxGeometry(0.24, 0.035, 0.04);
const leftLash = new THREE.Mesh(lashGeo, lashMat);
leftLash.position.set(-0.24, 0.57, 0.66);
leftLash.rotation.z = 0.12;
avatarGroup.add(leftLash);

const rightLash = new THREE.Mesh(lashGeo, lashMat);
rightLash.position.set(0.24, 0.57, 0.66);
rightLash.rotation.z = -0.12;
avatarGroup.add(rightLash);

// Sweet Smile
const smileCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(-0.13, 0.16, 0.65),
  new THREE.Vector3(-0.06, 0.12, 0.68),
  new THREE.Vector3(0.06, 0.12, 0.68),
  new THREE.Vector3(0.13, 0.16, 0.65)
);
const smileGeo = new THREE.TubeGeometry(smileCurve, 16, 0.018, 8, false);
const mouthMat = new THREE.MeshStandardMaterial({ color: 0xb34d58, roughness: 0.5 });
const smileMesh = new THREE.Mesh(smileGeo, mouthMat);
avatarGroup.add(smileMesh);

// Slender Neck
const neckGeo = new THREE.CylinderGeometry(0.22, 0.26, 0.35, 16);
const neck = new THREE.Mesh(neckGeo, skinMat);
neck.position.y = -0.18;
avatarGroup.add(neck);

// Torso / Teal-Green Zip Hoodie & White Shirt
const torsoGroup = new THREE.Group();
const hoodieGeo = new THREE.CylinderGeometry(0.55, 0.68, 1.1, 24);
const hoodie = new THREE.Mesh(hoodieGeo, hoodieMat);
hoodie.position.y = -0.85;
torsoGroup.add(hoodie);

// White inner t-shirt collar
const collarGeo = new THREE.TorusGeometry(0.26, 0.06, 12, 24);
const collar = new THREE.Mesh(collarGeo, whiteTeeMat);
collar.rotation.x = Math.PI / 2;
collar.position.y = -0.28;
torsoGroup.add(collar);

// Zipper line
const zipGeo = new THREE.BoxGeometry(0.035, 0.85, 0.03);
const zipMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8, roughness: 0.3 });
const zip = new THREE.Mesh(zipGeo, zipMat);
zip.position.set(0, -0.75, 0.6);
torsoGroup.add(zip);

// Shield Badge on Left Chest
const badgeGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.02, 16);
const badgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
const badge = new THREE.Mesh(badgeGeo, badgeMat);
badge.rotation.x = Math.PI / 2;
badge.position.set(-0.28, -0.65, 0.61);
torsoGroup.add(badge);

const badgeInner = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.025, 16), hoodieMat);
badgeInner.rotation.x = Math.PI / 2;
badgeInner.position.set(-0.28, -0.65, 0.62);
torsoGroup.add(badgeInner);

// Right Waving Arm (Friendly Greeting)
const armGroup = new THREE.Group();
armGroup.position.set(0.65, -0.52, 0);

const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.52, 16), hoodieMat);
upperArm.position.set(0.2, 0.22, 0.15);
upperArm.rotation.z = -0.65;
upperArm.rotation.x = 0.3;
armGroup.add(upperArm);

const forearmGroup = new THREE.Group();
forearmGroup.position.set(0.38, 0.45, 0.28);

const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.48, 16), hoodieMat);
forearm.position.y = 0.24;
forearm.rotation.z = 0.28;
forearmGroup.add(forearm);

// Hand
const hand = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), skinMat);
hand.scale.set(1.1, 1.25, 0.4);
hand.position.set(0.08, 0.52, 0);
hand.rotation.z = -0.15;
forearmGroup.add(hand);

// Fingers
const fingerGeo = new THREE.CylinderGeometry(0.03, 0.025, 0.2, 8);
for (let i = 0; i < 4; i++) {
  const finger = new THREE.Mesh(fingerGeo, skinMat);
  finger.position.set(-0.05 + i * 0.04, 0.66, 0);
  finger.rotation.z = (i - 1.5) * 0.07;
  forearmGroup.add(finger);
}
armGroup.add(forearmGroup);
torsoGroup.add(armGroup);

// Left Arm
const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.8, 16), hoodieMat);
leftArm.position.set(-0.7, -0.88, 0.06);
leftArm.rotation.z = 0.12;
torsoGroup.add(leftArm);

avatarGroup.add(torsoGroup);

// Floating Holographic Radar Shield & Scanning Wave
const shieldGroup = new THREE.Group();
const shieldShape = new THREE.Shape();
shieldShape.moveTo(0, 0.38);
shieldShape.quadraticCurveTo(0.28, 0.34, 0.3, 0.08);
shieldShape.quadraticCurveTo(0.28, -0.24, 0, -0.38);
shieldShape.quadraticCurveTo(-0.28, -0.24, -0.3, 0.08);
shieldShape.quadraticCurveTo(-0.28, 0.34, 0, 0.38);

const shieldGeo = new THREE.ExtrudeGeometry(shieldShape, { depth: 0.05, bevelEnabled: true, bevelSegments: 3, bevelSize: 0.02, bevelThickness: 0.02 });
const shieldMat = new THREE.MeshStandardMaterial({
  color: 0x52b788,
  roughness: 0.3,
  metalness: 0.2,
  emissive: 0x2d6a4f,
  emissiveIntensity: 0.45,
  transparent: true,
  opacity: 0.9
});
const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
shieldMesh.scale.set(0.65, 0.65, 0.65);
shieldGroup.add(shieldMesh);

shieldGroup.position.set(-0.6, 0.1, 0.9);
avatarGroup.add(shieldGroup);

// Glowing Sensor Pulse Rings
const ringGeo1 = new THREE.TorusGeometry(1.35, 0.01, 16, 64);
const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x52b788, transparent: true, opacity: 0.4 });
const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
ring1.rotation.x = Math.PI / 2.3;
ring1.position.y = -0.2;
scene.add(ring1);

// Interaction & Mouse tracking
let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
function onPointerMove(e) {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - rect.left;
  const y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - rect.top;
  targetX = (x / rect.width - 0.5) * 2;
  targetY = (y / rect.height - 0.5) * 2;
}
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('touchmove', onPointerMove, { passive: true });

// Animation Loop
let clock = new THREE.Clock();
let blinkTimer = 0, isBlinking = false;

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  mouseX += (targetX - mouseX) * 0.06;
  mouseY += (targetY - mouseY) * 0.06;

  // Gentle breathing
  avatarGroup.position.y = -0.1 + Math.sin(time * 2.2) * 0.03;
  
  // Head subtle eye & look tracking
  head.rotation.y = mouseX * 0.32 + Math.sin(time * 0.8) * 0.04;
  head.rotation.x = mouseY * 0.18 + Math.cos(time * 1.1) * 0.02;
  baseHair.rotation.y = head.rotation.y;
  topBunGroup.rotation.y = head.rotation.y * 0.9;

  // Eye movement
  leftEye.position.x = -0.24 + mouseX * 0.035;
  leftEye.position.y = 0.44 - mouseY * 0.035;
  rightEye.position.x = 0.24 + mouseX * 0.035;
  rightEye.position.y = 0.44 - mouseY * 0.035;

  // Natural anime blink
  blinkTimer += 0.016;
  if (blinkTimer > 3.4 && !isBlinking) isBlinking = true;
  if (isBlinking) {
    leftEye.scale.y = 0.1;
    rightEye.scale.y = 0.1;
    if (blinkTimer > 3.55) {
      leftEye.scale.y = 1.0;
      rightEye.scale.y = 1.0;
      isBlinking = false;
      blinkTimer = 0;
    }
  }

  // Waving greeting hand
  const wave = Math.sin(time * 5.0) * 0.35;
  forearmGroup.rotation.z = 0.32 + wave;
  hand.rotation.z = -0.12 + wave * 0.35;

  // Floating shield gentle bounce & rotation
  shieldGroup.position.y = 0.1 + Math.sin(time * 3.0) * 0.06;
  shieldGroup.rotation.y = Math.sin(time * 1.8) * 0.2;

  ring1.rotation.z = time * 0.35;

  renderer.render(scene, camera);
}
animate();

function onResize() {
  const newW = container.clientWidth || window.innerWidth || 390;
  const newH = container.clientHeight || 280;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
}
window.addEventListener('resize', onResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_36 -->
</body>
</html>
